function openInvoice(obj) {
  const isNew = !obj || !obj.id;
  const st = set_();
  let inv = Object.assign({ type: "sale", channel: "direct", date: today(), lines: [], discount: 0, paid: 0, vatPct: st.vatPct, status: "issued" }, obj || {});
  inv.lines = (inv.lines || []).map(l => Object.assign({}, l));
  if (!inv.lines.length) inv.lines.push({ productId: "", name: "", qty: 1, price: 0 });
  if (isNew) {
    if (!inv.no) inv.no = nextNo(inv.type);
    if (!inv.date) inv.date = today();
  } else if (obj.date == null) {
    inv.date = "";
  }
  const title = { sale: "Sales invoice", quote: "Price offer", foc: "Free of charge (FOC)" }[inv.type];
  const priceFor = p => p ? N(inv.channel === "agent" ? p.agentPrice : p.directPrice) : 0;

  function linesHtml() {
    return inv.lines.map((l, i) => {
      const p = byId("products", l.productId);
      const s = p ? stockOf(p) : null;
      return `<tr>
        <td style="min-width:180px">
          <select data-li="${i}" data-lk="productId">
            <option value="">Custom item</option>
            ${S.products.map(prod => `<option value="${prod.id}" ${prod.id === l.productId ? "selected" : ""}>${esc(prod.name)}</option>`).join("")}
          </select>
          ${l.productId ? "" : `<input data-li="${i}" data-lk="name" value="${esc(l.name)}" placeholder="Description" style="margin-top:4px">`}
          ${s != null ? `<div class="muted" style="font-size:11px">${m0(s)} in stock</div>` : ""}
        </td>
        <td style="width:80px"><input type="number" step="1" data-li="${i}" data-lk="qty" value="${esc(l.qty)}"></td>
        <td style="width:110px"><input type="number" step="0.01" data-li="${i}" data-lk="price" value="${esc(l.price)}"></td>
        <td style="width:130px">${p ? `<span class="muted num" title="Uses this item's recorded cost">${money(l.unitCost != null ? l.unitCost : unitCost(p))}</span>` : `<input type="number" step="0.01" min="0" data-li="${i}" data-lk="unitCost" value="${l.unitCost != null ? esc(l.unitCost) : ""}" placeholder="0.00" aria-label="Unit cost" title="Cost of this custom line — leave blank if unknown"><div class="muted" style="font-size:11px${l.unitCost == null ? ";color:var(--warn)" : ""}">${l.unitCost == null ? "cost not recorded" : "manual cost"}</div>`}</td>
        <td class="n">${money(N(l.qty) * N(l.price))}</td>
        <td><button type="button" class="btn sm danger" data-rm="${i}" aria-label="Remove line">×</button></td>
      </tr>`;
    }).join("");
  }

  function totalsHtml() {
    const t = invTotals(inv);
    return inv.type === "foc" ? `<div class="totals"><span>Value of goods</span><span class="num">${money(t.sub)}</span><span class="t">Amount due</span><span class="num t">${money(0)}</span></div>` :
      `<div class="totals">
        <span>Subtotal</span><span class="num">${money(t.sub)}</span>
        <span>Discount</span><span class="num">− ${money(t.disc)}</span>
        <span>VAT ${m1(t.vatPct)}%</span><span class="num">${money(t.vat)}</span>
        <span class="t">Total</span><span class="num t">${money(t.total)}</span>
        ${inv.type === "sale" ? `<span>Balance due</span><span class="num">${money(t.bal)}</span>` : ""}
      </div>`;
  }

  const html = `
    <div class="scrim" id="scrim">
      <form class="modal" id="iform" novalidate>
        <h3>${isNew ? "New" : "Edit"} ${title.toLowerCase()} · <span class="mono">${esc(inv.no)}</span></h3>
        <div class="fgrid">
          <label class="f">Number<input id="i_no" value="${esc(inv.no)}"></label>
          <label class="f">Date<input id="i_date" type="date" value="${esc(inv.date)}"></label>
          <label class="f">Sold through<select id="i_channel"><option value="direct" ${inv.channel === "direct" ? "selected" : ""}>Direct customer</option><option value="agent" ${inv.channel === "agent" ? "selected" : ""}>Agent</option></select></label>
          ${inv.type === "sale" ? `<label class="f">Status<select id="i_status"><option value="issued" ${inv.status !== "void" ? "selected" : ""}>Issued</option><option value="void" ${inv.status === "void" ? "selected" : ""}>Void (cancelled)</option></select></label>` : ""}
          <label class="f">${inv.channel === "agent" ? "Agent / company" : "Customer"} name<input id="i_customer" value="${esc(inv.customer || "")}"></label>
          <label class="f">Phone<input id="i_phone" value="${esc(inv.phone || "")}"></label>
          <label class="f">Customer TRN<input id="i_ctrn" value="${esc(inv.ctrn || "")}"></label>
          <label class="f">Address<input id="i_addr" value="${esc(inv.addr || "")}"></label>
          ${inv.type === "foc" ? `<label class="f">Reason<input id="i_reason" value="${esc(inv.reason || "")}" placeholder="Sample, gift, event…"></label>` : ""}
        </div>
        <div class="tbl-wrap lines">
          <table>
            <thead>
              <tr><th>Item</th><th>Qty</th><th>Price</th><th>Unit cost</th><th class="n">Amount</th><th></th></tr>
            </thead>
            <tbody id="ilines">${linesHtml()}</tbody>
          </table>
        </div>
        <div>
          <button type="button" class="btn sm" id="iadd">+ Add line</button>
          <span class="muted" style="font-size:12px">Prices fill from the item's agent / direct price; unit cost fills from the item's recorded cost. Custom lines take a manual unit cost — leave blank only if the cost is genuinely unknown.</span>
        </div>
        <div class="fgrid">
          ${inv.type !== "foc" ? `<label class="f">Discount (${cur()})<input id="i_discount" type="number" step="0.01" value="${esc(inv.discount)}"></label><label class="f">VAT %<input id="i_vat" type="number" step="0.01" value="${esc(inv.vatPct)}"></label>` : ""}
          ${inv.type === "sale" ? `<label class="f">Amount received<input id="i_paid" type="number" step="0.01" value="${esc(inv.paid)}"></label><label class="f">Payment method<select id="i_method">${["Cash","Bank transfer","Card","Cheque","Other"].map(m => `<option ${m === inv.method ? "selected" : ""}>${m}</option>`).join("")}</select></label>` : ""}
          <label class="f wide">Notes on document<textarea id="i_notes">${esc(inv.notes || "")}</textarea></label>
        </div>
        <div id="itotals">${totalsHtml()}</div>
        <p id="iErr" class="banner" hidden></p>
        <div class="mfoot">
          <button class="btn" type="button" id="iPdf">Save & PDF</button>
          <div class="r">
            <button class="btn" type="button" id="mCancel">Cancel</button>
            <button class="btn pri" type="submit">Save</button>
          </div>
        </div>
      </form>
    </div>
  `;

  $("#modalRoot").innerHTML = html;

  const refresh = () => { $("#itotals").innerHTML = totalsHtml(); };
  const readHead = () => {
    inv.no = $("#i_no").value.trim();
    inv.date = $("#i_date").value;
    inv.customer = $("#i_customer").value;
    inv.phone = $("#i_phone").value;
    inv.ctrn = $("#i_ctrn").value;
    inv.addr = $("#i_addr").value;
    inv.notes = $("#i_notes").value;
    if ($("#i_reason")) inv.reason = $("#i_reason").value;
    if ($("#i_status")) inv.status = $("#i_status").value;
    if ($("#i_discount")) inv.discount = N($("#i_discount").value);
    if ($("#i_vat")) inv.vatPct = N($("#i_vat").value);
    if ($("#i_paid")) inv.paid = N($("#i_paid").value);
    if ($("#i_method")) inv.method = $("#i_method").value;
  };

  const redrawLines = () => {
    readHead();
    $("#ilines").innerHTML = linesHtml();
    refresh();
  };

  $("#ilines").addEventListener("input", e => {
    const i = e.target.dataset.li, k = e.target.dataset.lk;
    if (i == null) return;
    const l = inv.lines[+i];
    if (k === "productId") {
      l.productId = e.target.value;
      const p = byId("products", l.productId);
      l.name = p ? p.name : "";
      l.price = priceFor(p);
      redrawLines();
      return;
    }
    l[k] = k === "unitCost" ? (e.target.value === "" ? null : N(e.target.value)) : e.target.value;
    const row = e.target.closest("tr");
    row.querySelector("td.n").textContent = money(N(l.qty) * N(l.price));
    if (k === "unitCost") {
      const h = row.querySelector("td div.muted:last-child");
      if (h) {
        h.textContent = l.unitCost == null ? "cost not recorded" : "manual cost";
        h.style.color = l.unitCost == null ? "var(--warn)" : "var(--muted)";
      }
    }
    refresh();
  });

  $("#ilines").addEventListener("click", e => {
    const r = e.target.dataset.rm;
    if (r == null) return;
    inv.lines.splice(+r, 1);
    if (!inv.lines.length) inv.lines.push({ productId: "", name: "", qty: 1, price: 0 });
    redrawLines();
  });

  $("#iadd").onclick = () => {
    inv.lines.push({ productId: "", name: "", qty: 1, price: 0 });
    redrawLines();
  };

  $("#i_channel").addEventListener("change", e => {
    readHead();
    inv.channel = e.target.value;
    inv.lines.forEach(l => {
      const p = byId("products", l.productId);
      if (p) l.price = priceFor(p);
    });
    openInvoice(Object.assign({}, inv, { id: obj && obj.id }));
  });

  ["i_discount", "i_vat", "i_paid"].forEach(i => {
    const el = $("#" + i);
    el && el.addEventListener("input", () => { readHead(); refresh(); });
  });

  $("#mCancel").onclick = closeModal;
  $("#scrim").addEventListener("mousedown", e => { if (e.target.id === "scrim") closeModal(); });

  const doSave = async () => {
    readHead();
    inv.lines = inv.lines.filter(l => l.productId || String(l.name).trim());
    const err = t => { const er = $("#iErr"); er.hidden = false; er.textContent = t; };

    if (!inv.lines.length) { err("Add at least one item to save."); inv.lines.push({ productId: "", name: "", qty: 1, price: 0 }); return null; }
    if (!inv.no) { err("Add a document number."); return null; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(inv.date || ""))) { err("Add a valid document date — an empty date would drop this document from period totals."); return null; }

    inv.lines.forEach(l => {
      l.qty = N(l.qty);
      l.price = N(l.price);
      const p = byId("products", l.productId);
      if (p) {
        l.name = p.name;
        if (l.unitCost == null || isNew) l.unitCost = +unitCost(p).toFixed(4);
      } else {
        l.name = String(l.name || "").trim();
        l.unitCost = l.unitCost == null ? null : +N(l.unitCost);
      }
    });

    if (inv.lines.some(l => l.qty < 0 || l.price < 0 || (l.unitCost != null && l.unitCost < 0)) || N(inv.discount) < 0 || N(inv.paid) < 0 || N(inv.vatPct) < 0) {
      err("Qty, price, unit cost, discount, VAT and payment can't be negative.");
      return null;
    }

    const id = (obj && obj.id) || uid();
    const d = Object.assign({}, inv);
    delete d.id;
    delete d._fromOffer;
    let r;
    try { r = await save("invoices", id, d); } catch(_) { return null; }

    if (inv._fromOffer) {
      const off = byId("invoices", inv._fromOffer);
      if (off && !off.converted) {
        try { await save("invoices", off.id, Object.assign({}, off, { converted: true, convertedTo: id })); } catch(_) {}
      }
    }

    const o = Object.assign({}, d, { id });
    if (r === "temp") o._tempSave = true;
    return o;
  };

  $("#iform").onsubmit = async e => {
    e.preventDefault();
    const r = await doSave();
    if (r) {
      closeModal();
      toast(r._tempSave ? "Saved for this session only — browser storage unavailable" : "Saved " + inv.no);
    }
  };

  $("#iPdf").onclick = async () => {
    const r = await doSave();
    if (r) {
      closeModal();
      invoicePdf(r);
    }
  };
}

    return;
  }

  // Theme toggle

  if (e.target.closest("#mobileMenuBtn")) {
    const sb = $("#mainSidebar");
    const bdrop = $("#sidebarBackdrop");
    const isOpen = sb.classList.toggle("mobile-open");
    if (bdrop) bdrop.classList.toggle("active", isOpen);
    return;

  // CRUD global buttons
  const t = e.target.closest("button");

  const ds = t.dataset;

  if (ds.new) {
    if (ds.new === "invoices") openInvoice({ type: ds.type || "sale" });
    else openForm(ds.new, {});
  }
  if (ds.edit) openForm(ds.edit, byId(ds.edit, ds.id));
  if (ds.del) {
    const w = t.parentElement;
    w.innerHTML = `<span class="confirm">Delete? <button class="btn sm danger" data-delyes="${ds.del}" data-id="${ds.id}">Yes</button><button class="btn sm" data-delno="1">No</button></span>`;
  }
  if (ds.delno) render();
  if (ds.delyes) {
    const r = await del(ds.delyes, ds.id);
    if (r === "failed") toast("Couldn't delete — browser storage is unavailable.");
    else if (r === "temp") toast("Deleted for this session only — browser storage unavailable");

  }
  if (ds.invpdf) invoicePdf(byId("invoices", ds.invpdf));
  if (ds.convert) {
    const qt = byId("invoices", ds.convert);
    if (!qt) return;
    if (qt.converted) { toast("This offer was already converted."); return; }
    const c = JSON.parse(JSON.stringify(qt));

    delete c.updatedAt;
    delete c.converted;
    delete c.convertedTo;
    delete c.example;

    c.no = nextNo("sale");

  }

});

const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "file";

async function offer(filename, data) {
  if (dl) {
    try {
      await dl.save({ filename, data });
    } catch(e) {
      if (e.code === "declined") return;
      toast(e.code === "rate_limited" ? "A download is already waiting for your answer." : "Couldn't save the file here.");
    }
    return;
  }
  try {
    const type = /\.xlsx$/i.test(filename) ? "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" : /\.pdf$/i.test(filename) ? "application/pdf" : "application/octet-stream";
    const url = URL.createObjectURL(new Blob([data], { type }));
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch(e) {
    toast("Couldn't save the file here.");
  }
}

function sheets() {
  const r2 = v => Math.round(N(v) * 100) / 100;
  return {
    "Summary": (() => {
      const sales = liveInv().filter(i => i.type === "sale");
      const rev = sales.reduce((a, i) => { const t = invTotals(i); return a + t.sub - t.disc; }, 0);
      const cogs = sales.reduce((a, i) => a + invCost(i), 0);
      const foc = liveInv().filter(i => i.type === "foc").reduce((a, i) => a + invCost(i), 0);
      const exp = S.expenses.filter(e => e.category !== "Filament purchase").reduce((a, e) => a + N(e.amount), 0);
      return [
        { Item: "Sales ex VAT (all time)", Value: r2(rev) },
        { Item: "Cost of goods sold", Value: r2(cogs) },
        { Item: "Gross profit", Value: r2(rev - cogs) },
        { Item: "FOC cost", Value: r2(foc) },
        { Item: "Expenses (excl. filament)", Value: r2(exp) },
        { Item: "Net profit", Value: r2(rev - cogs - foc - exp) },
        { Item: "Receivables", Value: r2(sales.reduce((a, i) => a + invTotals(i).bal, 0)) },
        { Item: "Printed stock (pcs)", Value: S.products.reduce((a, p) => a + Math.max(0, stockOf(p)), 0) },
        { Item: "Filament on hand (g)", Value: r2(S.filaments.reduce((a, f) => a + Math.max(0, filLeft(f)), 0)) }
      ];
    })(),
    "Printed stock": S.products.map(p => ({
      Item: p.name, SKU: p.sku || "", Category: p.category || "", Location: p.location || "",
      Filament: (byId("filaments", p.filamentId) || {}).name || "", "Grams/item": N(p.grams),
      "Print min/item": N(p.minutes), "Opening stock": N(p.openingStock), "In stock": stockOf(p),
      "Unit cost": r2(unitCost(p)), "Agent price": r2(p.agentPrice), "Direct price": r2(p.directPrice),
      "Stock value": r2(Math.max(0, stockOf(p)) * unitCost(p))
    })),
    "Filament": S.filaments.map(f => ({
      Name: f.name, Material: f.material || "", Brand: f.brand || "", Colour: f.color || "",
      Location: f.location || "", "Bought (g)": N(f.weightG), "Used (g)": r2(filUsed(f)),
      "Remaining (g)": r2(filLeft(f)), "Price paid": r2(f.price), "Per kg": r2(filCostKg(f)),
      "Value left": r2(Math.max(0, filLeft(f)) * filCostKg(f) / 1000), "Purchase date": f.date || ""
    })),
    "Print log": S.prints.map(p => ({
      Date: p.date, Item: (byId("products", p.productId) || {}).name || "", Good: N(p.qty),
      Failed: N(p.failed), Filament: (byId("filaments", p.filamentId) || {}).name || "",
      "Grams used": N(p.grams), Hours: N(p.hours), Note: p.note || ""
    })),
    "Invoices": S.invoices.map(i => {
      const t = invTotals(i);
      return {
        No: i.no, Type: { sale: "Invoice", quote: "Offer", foc: "FOC" }[i.type], Date: i.date,
        Channel: i.channel === "agent" ? "Agent" : "Direct", Customer: i.customer || "",
        Phone: i.phone || "", Subtotal: r2(t.sub), Discount: r2(t.disc), VAT: r2(t.vat),
        Total: r2(t.total), Paid: r2(t.paid), Balance: r2(t.bal), Status: payStatus(i)[0],
        Cost: r2(invCost(i))
      };
    }),
    "Invoice lines": S.invoices.flatMap(i => (i.lines || []).map(l => ({
      No: i.no, Date: i.date, Type: i.type, Item: l.name, Qty: N(l.qty), Price: r2(l.price),
      Amount: r2(N(l.qty) * N(l.price)),
      "Unit cost": l.unitCost != null ? r2(l.unitCost) : (byId("products", l.productId) ? r2(unitCost(byId("products", l.productId))) : "")
    }))),
    "Expenses": S.expenses.map(e => ({ Date: e.date, Category: e.category, Description: e.desc || "", Amount: r2(e.amount) })),
    "Accounts": (() => {
      const m = {};
      liveInv().forEach(i => {
        const k = String(i.date).slice(0, 7), t = invTotals(i);
        m[k] = m[k] || { Month: k, "Sales ex VAT": 0, "Cost of goods": 0, "FOC cost": 0, Expenses: 0, VAT: 0 };
        if (i.type === "sale") {
          m[k]["Sales ex VAT"] += t.sub - t.disc;
          m[k]["Cost of goods"] += invCost(i);
          m[k].VAT += t.vat;
        } else {
          m[k]["FOC cost"] += invCost(i);
        }
      });
      S.expenses.filter(e => e.category !== "Filament purchase").forEach(e => {
        const k = String(e.date).slice(0, 7);
        m[k] = m[k] || { Month: k, "Sales ex VAT": 0, "Cost of goods": 0, "FOC cost": 0, Expenses: 0, VAT: 0 };
        m[k].Expenses += N(e.amount);
      });
      return Object.values(m).sort((a, b) => a.Month.localeCompare(b.Month)).map(r => Object.assign({}, r, { "Net profit": r["Sales ex VAT"] - r["Cost of goods"] - r["FOC cost"] - r.Expenses })).map(r => {
        for (const k in r) if (typeof r[k] === "number") r[k] = r2(r[k]);
        return r;
      });
    })()
  };
}

function exportXlsx(names, filename) {
  if (!window.XLSX) { toast("Excel library didn't load — check your connection."); return; }
  try {
    const all = sheets(), wb = XLSX.utils.book_new();
    (names || Object.keys(all)).forEach(n => {
      const ws = all[n].length ? XLSX.utils.json_to_sheet(all[n]) : XLSX.utils.aoa_to_sheet([["No records"]]);
      const cols = all[n].length ? Object.keys(all[n][0]).map(k => ({ wch: Math.max(k.length, ...all[n].map(r => String(r[k] ?? "").length)) + 2 })) : [];
      ws["!cols"] = cols;
      XLSX.utils.book_append_sheet(wb, ws, n);
    });
    saveXlsx(wb, filename);
  } catch(e) {
    toast("Couldn't build the Excel file.");
  }
}

function saveXlsx(wb, filename) {
  try {
    offer(filename, XLSX.write(wb, { bookType: "xlsx", type: "array" }));
  } catch(e) {
    toast("Couldn't build the Excel file.");
  }
}

function pdfHead(title, landscape) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: landscape ? "landscape" : "portrait", unit: "mm", format: "a4" });
  const st = set_(), W = doc.internal.pageSize.getWidth();
  doc.setFillColor(37, 99, 235);
  doc.rect(0, 0, W, 3.5, "F");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(18);
  doc.setTextColor(15, 23, 42);
  doc.text(st.bizName || "Print Studio", 14, 18);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.setTextColor(100, 116, 139);
  doc.text([st.address, [st.phone && "Tel " + st.phone, st.email].filter(Boolean).join("  ·  "), st.trn ? "TRN " + st.trn : ""].filter(Boolean), 14, 24);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  doc.setTextColor(37, 99, 235);
  doc.text(title, W - 14, 18, { align: "right" });
  doc.setTextColor(15, 23, 42);
  doc.setFont("helvetica", "normal");
  return doc;
}

function savePdf(doc, filename) {
  try {
    const n = doc.internal.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i);
      doc.setFontSize(8);
      doc.setTextColor(140);
      doc.text(`Page ${i} of ${n}`, doc.internal.pageSize.getWidth() - 14, doc.internal.pageSize.getHeight() - 8, { align: "right" });
    }
    offer(filename, doc.output("arraybuffer"));
  } catch(e) {
    toast("Couldn't build the PDF.");
  }
}

function invoicePdf(i) {

    const doc = pdfHead(title), W = doc.internal.pageSize.getWidth();
    doc.setFontSize(10);
    doc.text([`No. ${i.no}`, `Date: ${i.date}`, i.type === "quote" ? "Valid for 14 days" : "", i.channel === "agent" ? "Channel: Agent" : "Channel: Direct"].filter(Boolean), W - 14, 25, { align: "right" });
    doc.setFont("helvetica", "bold");

    doc.setFont("helvetica", "normal");

    const body = (i.lines || []).map((l, k) => [k + 1, l.name, m0(l.qty), money(l.price), money(N(l.qty) * N(l.price))]);
    doc.autoTable({
      startY: 72,
      head: [["#", "Item", "Qty", "Unit price", "Amount"]],

      columnStyles: { 0: { cellWidth: 10 }, 2: { halign: "right" }, 3: { halign: "right" }, 4: { halign: "right" } }
    });
    let y = doc.lastAutoTable.finalY + 8;
    const rows = i.type === "foc" ? [["Value of goods", money(t.sub)], ["Free of charge", `− ${money(t.sub)}`], ["Amount due", money(0)]] :
      [["Subtotal", money(t.sub)], ...(t.disc ? [["Discount", `− ${money(t.disc)}`]] : []), [`VAT ${m1(t.vatPct)}%`, money(t.vat)], ["Total", money(t.total)], ...(i.type === "sale" ? [["Paid", money(t.paid)], ["Balance due", money(t.bal)]] : [])];
    rows.forEach(([a, b]) => {
      const bold = a === "Total" || a === "Amount due" || a === "Balance due";

    }

    toast("Couldn't build the PDF.");
  }

function reportPdf(parts, filename) {
  if (!window.jspdf) { toast("PDF library didn't load — check your connection."); return; }
  try {
    const all = sheets(), doc = pdfHead("BUSINESS REPORT", true);
    doc.setFontSize(10);
    doc.text("Generated " + new Date().toLocaleString(), 14, 40);
    let y = 46;
    const map = { summary: "Summary", products: "Printed stock", filaments: "Filament", prints: "Print log", accounts: "Accounts", invoices: "Invoices", expenses: "Expenses" };
    parts.forEach((p, ix) => {
      const name = map[p], rows = all[name];
      if (ix && y > 150) { doc.addPage(); y = 20; }
      doc.setFont("helvetica", "bold");
      doc.setFontSize(12);
      doc.text(name, 14, y);
      doc.setFont("helvetica", "normal");
      if (!rows.length) {
        doc.setFontSize(10);
        doc.text("No records", 14, y + 6);
        y += 14;
        return;
      }
      const cols = Object.keys(rows[0]);
      doc.autoTable({
        startY: y + 3,
        head: [cols],
        body: rows.map(r => cols.map(c => typeof r[c] === "number" ? r[c].toLocaleString("en-US", { maximumFractionDigits: 2 }) : r[c])),
        theme: "striped",
        headStyles: { fillColor: [37, 99, 235], fontSize: 8 },
        styles: { fontSize: 8 }
      });
      y = doc.lastAutoTable.finalY + 10;
    });
    savePdf(doc, filename);
  } catch(e) {
    toast("Couldn't build the PDF report.");
  }
}

function setSyncStandalone() {
  if (HOST) return;
  const ok = store.ok();
  $("#syncDot").className = "dot " + (ok ? "on" : "off");
  $("#syncTxt").textContent = ok ? "Saved in this browser" : "Not saving — changes are temporary";
}

})();
</script>
</body>
