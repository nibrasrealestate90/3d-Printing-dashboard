<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Print Studio Ledger</title>
  
  <!-- Preconnect & Google Fonts: Figtree, Manrope & Geist Mono (Medsathi Typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Manrope:wght@400..800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- External Libraries: Apache ECharts, SheetJS, jsPDF & AutoTable -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <script>
    // Theme initialization (defaults to clean light mode, persists user selection)
    (function() {
      try {
        const savedTheme = localStorage.getItem('theme_preference');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* ==========================================================================
       Print Studio Ledger · Medsathi Design Principles & Precision Tokens
       ========================================================================== */
    :root {
      --font-sans: 'Figtree', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Manrope', 'Figtree', system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

      /* Light Theme Colors (Medsathi Palette) */
      --bg: #f8fafc;
      --card: #ffffff;
      --card-subtle: #fbfcfe;
      --surface: #ffffff;
      --sunk: #f1f5f9;
      --line: #e2e8f0;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --border-focus: #3b82f6;

      --ink: #0f172a;
      --ink2: #475569;
      --muted: #64748b;
      --foreground: #0f172a;
      --foreground-muted: #64748b;
      --foreground-subtle: #94a3b8;

      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --primary-glow: rgba(37, 99, 235, 0.16);

      --accent: #2563eb;
      --accent-ink: #ffffff;
      --accent-soft: #eff6ff;

      --brand-navy: #0b2253;
      --brand-amber: #f59e0b;

      --good: #10b981;
      --good-soft: #ecfdf5;
      --good-text: #059669;

      --warn: #f59e0b;
      --warn-soft: #fffbeb;
      --warn-text: #d97706;

      --bad: #ef4444;
      --bad-soft: #fef2f2;
      --bad-text: #dc2626;

      --info: #0284c7;
      --info-soft: #f0f9ff;
      --info-text: #0369a1;

      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --r: 12px;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.04), 0 4px 12px -2px rgba(15, 23, 42, 0.05);
      --shadow-lift: 0 4px 20px -4px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
      --shadow-pop: 0 12px 36px -6px rgba(15, 23, 42, 0.16);

      --sidebar-width: 250px;
      --sidebar-collapsed-width: 72px;
      --header-height: 64px;
    }

    .dark {
      --bg: #0b1120;
      --card: #131d33;
      --card-subtle: #17233d;
      --surface: #131d33;
      --sunk: #17233d;
      --line: #1e2d4d;
      --border: #1e2d4d;
      --border-subtle: #17233d;
      --border-focus: #60a5fa;

      --ink: #f8fafc;
      --ink2: #cbd5e1;
      --muted: #94a3b8;
      --foreground: #f8fafc;
      --foreground-muted: #94a3b8;
      --foreground-subtle: #64748b;

      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: rgba(59, 130, 246, 0.12);
      --primary-border: rgba(59, 130, 246, 0.3);
      --primary-glow: rgba(59, 130, 246, 0.25);

      --accent: #3b82f6;
      --accent-ink: #ffffff;
      --accent-soft: rgba(59, 130, 246, 0.15);

      --brand-navy: #93c5fd;
      --brand-amber: #fbbf24;

      --good: #34d399;
      --good-soft: rgba(16, 185, 129, 0.15);
      --good-text: #34d399;

      --warn: #fbbf24;
      --warn-soft: rgba(245, 158, 11, 0.15);
      --warn-text: #fbbf24;

      --bad: #f87171;
      --bad-soft: rgba(239, 68, 68, 0.15);
      --bad-text: #f87171;

      --info: #38bdf8;
      --info-soft: rgba(14, 165, 233, 0.15);
      --info-text: #38bdf8;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.25);
      --shadow-lift: 0 8px 24px -4px rgba(0, 0, 0, 0.5);
      --shadow-pop: 0 16px 40px -8px rgba(0, 0, 0, 0.65);
    }

    /* Base Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 13.5px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      display: flex;
      min-height: 100vh;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .num, td.n, th.n {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .mono {
      font-family: var(--font-mono);
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    #app {
      display: flex;
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    /* ==========================================================================
       Sidebar Navigation (Medsathi Structure)
       ========================================================================== */
    aside.sidebar {
      width: var(--sidebar-width);
      background: var(--card);
      border-right: 1px solid var(--border);
      height: 100vh;
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      z-index: 40;
      transition: width 0.26s cubic-bezier(0.16, 1, 0.3, 1), transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
      user-select: none;
    }

    aside.sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
    }

    .sidebar-brand {
      height: var(--header-height);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 55%, #0ea5e9 130%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 4px 12px rgba(37, 99, 235, 0.35);
      cursor: pointer;
    }

    .brand-mark svg {
      width: 22px;
      height: 22px;
      stroke: #ffffff;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      white-space: nowrap;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .brand-title .brand-primary {
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--brand-amber);
    }

    .brand-title .brand-sub {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--brand-navy);
      margin-top: 2px;
    }

    .sidebar.collapsed .brand-title {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-10px);
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .sidebar-nav::-webkit-scrollbar {
      width: 4px;
    }
    .sidebar-nav::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .nav-group-label {
      padding: 0 10px 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--foreground-subtle);
      text-transform: uppercase;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .sidebar.collapsed .nav-group-label {
      display: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: var(--radius);
      color: var(--foreground-muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      transition: all 0.18s ease;
      white-space: nowrap;
      border: 1px solid transparent;
      outline: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background: var(--primary-light);
      color: var(--foreground);
    }

    .nav-item.active {
      color: var(--primary);
      background: var(--primary-light);
      border-color: var(--primary-border);
      font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.15);
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      stroke-width: 2.1;
      transition: transform 0.2s ease;
    }

    .nav-item:hover svg {
      transform: scale(1.08);
    }

    .sidebar.collapsed .nav-item {
      justify-content: center;
      padding: 10px 0;
    }

    .sidebar.collapsed .nav-item span.nav-text,
    .sidebar.collapsed .nav-item span.nav-badge {
      display: none;
    }

    .nav-badge {
      margin-left: auto;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      background: var(--border);
      color: var(--foreground-muted);
    }

    .nav-badge.danger {
      background: var(--bad-soft);
      color: var(--bad-text);
    }

    /* Sidebar Footer */
    .sidebar-footer {
      padding: 12px 10px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .btn-sidebar-collapse {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius);
      color: var(--foreground-muted);
      font-size: 12.5px;
      font-weight: 600;
      border: 0;
      background: transparent;
      cursor: pointer;
      width: 100%;
      transition: all 0.18s;
    }

    .btn-sidebar-collapse:hover {
      background: var(--border-subtle);
      color: var(--foreground);
    }

    .sidebar.collapsed .btn-sidebar-collapse {
      justify-content: center;
      padding: 10px 0;
    }

    .sidebar.collapsed .btn-sidebar-collapse span {
      display: none;
    }

    .btn-sidebar-reset,
    .btn-sidebar-delete {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 12.5px;
      font-weight: 600;
      border: 0;
      background: transparent;
      cursor: pointer;
      width: 100%;
      transition: all 0.18s;
    }

    .btn-sidebar-reset {
      color: var(--primary);
    }

    .btn-sidebar-reset:hover {
      background: var(--accent-soft);
      color: var(--primary-hover);
    }

    .btn-sidebar-delete {
      color: var(--bad-text);
    }

    .btn-sidebar-delete:hover {
      background: var(--bad-soft);
    }

    .sidebar.collapsed .btn-sidebar-reset,
    .sidebar.collapsed .btn-sidebar-delete {
      justify-content: center;
      padding: 10px 0;
    }

    .sidebar.collapsed .btn-sidebar-reset span,
    .sidebar.collapsed .btn-sidebar-delete span {
      display: none;
    }

    /* ==========================================================================
       Header Topbar & Main Workspace
       ========================================================================== */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }

    header.topbar {
      height: var(--header-height);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      transition: background 0.2s, border-color 0.2s;
    }

    .dark header.topbar {
      background: rgba(19, 29, 51, 0.85);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .mobile-menu-btn {
      display: none;
      padding: 8px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--foreground);
      cursor: pointer;
    }

    .page-title-box {
      display: flex;
      flex-direction: column;
    }

    .breadcrumb-tiny {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--foreground-subtle);
      margin-bottom: 2px;
    }

    .page-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--foreground);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sync-indicator {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-right: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.on { background: var(--good); }
    .dot.off { background: var(--warn); }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--foreground-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s;
    }

    .btn-icon:hover {
      background: var(--border-subtle);
      color: var(--foreground);
      border-color: var(--foreground-subtle);
    }

    /* Main Container Content */
    main#main {
      flex: 1;
      padding: 24px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ==========================================================================
       Cards, Grids & Headers (Medsathi Design Language)
       ========================================================================== */
    .sec-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-bottom: 16px;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      width: 100%;
      justify-content: space-between;
    }

    .tools-filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 auto;
      min-width: 0;
    }

    .tools-filter-group .search-wrap {
      width: 380px;
      max-width: 100%;
      margin-right: 0;
    }

    .tools-action-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-left: auto;
    }

    .tools .btn {
      height: 38px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
    }

    .tools select {
      height: 38px;
      padding: 0 32px 0 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      width: auto;
      border: 1px solid var(--border);
      background-color: var(--card);
      color: var(--ink);
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      min-width: 0;
      box-shadow: var(--shadow-card);
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .panel:hover {
      box-shadow: var(--shadow-lift);
    }

    .panel h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--foreground);
    }

    .grid { display: grid; gap: 16px; }
    .g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font: 600 13px var(--font-sans);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.16s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--border-subtle);
      border-color: var(--ink2);
    }

    .btn.pri {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .btn.pri:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transform: translateY(-1px);
    }

    .btn.sm {
      padding: 4px 9px;
      font-size: 12px;
      border-radius: 6px;
    }

    .btn.danger {
      color: var(--bad);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .btn.danger:hover {
      background: var(--bad-soft);
    }

    .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* KPIs Grid */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .kpi:hover {
      box-shadow: var(--shadow-card);
      border-color: var(--border-focus);
    }

    .kpi .l {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 700;
    }

    .kpi .v {
      font: 800 24px var(--font-display);
      font-variant-numeric: tabular-nums;
      color: var(--foreground);
      line-height: 1.1;
    }

    .kpi .s {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Quick Actions 6-Card Grid (Medsathi Signature) */
    .quick-actions-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow-card);
    }

    .quick-actions-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .quick-action-tile {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
      color: var(--foreground);
    }

    .quick-action-tile:hover {
      background: var(--card-subtle);
      border-color: var(--primary-border);
      transform: translateY(-1.5px);
      box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
    }

    .tile-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .quick-action-tile:hover .tile-icon-box {
      transform: scale(1.08);
    }

    .tile-icon-box.brand    { background: var(--primary-light); color: var(--primary); }
    .tile-icon-box.success  { background: var(--good-soft); color: var(--good-text); }
    .tile-icon-box.info     { background: var(--info-soft); color: var(--info-text); }
    .tile-icon-box.warning  { background: var(--warn-soft); color: var(--warn-text); }
    .tile-icon-box.danger   { background: var(--bad-soft); color: var(--bad-text); }
    .tile-icon-box.neutral  { background: var(--sunk); color: var(--muted); }

    .tile-icon-box svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
    }

    .tile-texts {
      min-width: 0;
      overflow: hidden;
    }

    .tile-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .tile-desc {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* ECharts Segmented Controller */
    .segmented-control {
      display: inline-flex;
      background: var(--sunk);
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
    }

    .segment-btn {
      padding: 4px 12px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      border: 0;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .segment-btn.active {
      background: var(--card);
      color: var(--foreground);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
    }

    /* Tables */
    .tbl-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 700;
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--sunk);
      white-space: nowrap;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
      color: var(--ink);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tr:hover td {
      background: var(--primary-light);
    }

    td.act {
      white-space: nowrap;
      text-align: right;
    }

    .empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
    }

    .pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2.5px 8px;
      border-radius: 99px;
      white-space: nowrap;
    }

    .pill.good { background: var(--good-soft); color: var(--good-text); }
    .pill.warn { background: var(--warn-soft); color: var(--warn-text); }
    .pill.bad  { background: var(--bad-soft); color: var(--bad-text); }
    .pill.acc  { background: var(--accent-soft); color: var(--primary); }
    .pill.neu  { background: var(--sunk); color: var(--ink2); }

    .thumb {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--sunk);
      display: block;
      border: 1px solid var(--border);
    }

    .thumb.ph {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 10px;
    }

    .swatch {
      display: inline-block;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1px solid var(--border);
      vertical-align: -2px;
      margin-right: 6px;
    }

    .bar {
      height: 7px;
      background: var(--sunk);
      border-radius: 4px;
      overflow: hidden;
      min-width: 70px;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
    }

    .bar i.low {
      background: var(--warn);
    }

    .alerts {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .alerts li {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-subtle);
    }

    .alerts li:last-child {
      border-bottom: 0;
    }

    .banner {
      padding: 10px 14px;
      border-radius: var(--radius);
      background: var(--warn-soft);
      color: var(--warn-text);
      font-size: 13px;
    }

    .banner.info {
      background: var(--accent-soft);
      color: var(--primary);
    }

    input, select, textarea {
      font: 13.5px var(--font-sans);
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
      width: 100%;
      min-width: 0;
      transition: all 0.16s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    textarea {
      min-height: 68px;
      resize: vertical;
    }

    label.f {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--ink2);
      font-weight: 600;
      min-width: 0;
    }

    .fgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .fgrid .wide {
      grid-column: 1 / -1;
    }

    .search-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 380px;
      max-width: 100%;
      margin-right: auto;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
      transition: color 0.16s ease;
    }

    .search-wrap:focus-within .search-icon {
      color: var(--primary);
    }

    .search-wrap input.search {
      width: 100%;
      height: 38px;
      padding: 0 34px 0 38px;
      font-size: 13.5px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--ink);
      transition: all 0.16s ease;
      box-shadow: var(--shadow-sm);
    }

    .search-wrap input.search:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--primary-glow);
      outline: none;
    }

    .search-wrap input.search::placeholder {
      color: var(--muted);
      font-size: 13px;
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--border);
      color: var(--muted);
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      line-height: 1;
      padding: 0;
      transition: all 0.15s ease;
    }

    .search-clear:hover {
      background: var(--bad-soft);
      color: var(--bad-text);
    }

    /* Modal / Scrim */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: max(28px, env(safe-area-inset-top, 0px)) 16px 28px;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: min(760px, 100%);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow-pop);
      animation: scaleUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal h3 {
      font-size: 18px;
      font-weight: 800;
    }

    .mfoot {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      margin-top: 4px;
    }

    .mfoot .r {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .lines td { padding: 6px 8px; }
    .lines input, .lines select { padding: 6px 8px; font-size: 13px; }

    .totals {
      display: grid;
      grid-template-columns: auto auto;
      gap: 5px 20px;
      justify-content: end;
      font-size: 13.5px;
    }

    .totals .t {
      font-weight: 800;
      font-size: 16px;
      color: var(--primary);
    }

    .calc {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 18px;
    }

    /* Sidebar Backdrop (Mobile Drawer) */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .sidebar-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 960px) {
      .calc { grid-template-columns: 1fr; }
      .quick-actions-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 768px) {
      /* Sidebar Off-canvas Drawer */
      aside.sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        height: 100vh;
        height: 100dvh;
        width: 280px;
        max-width: 82vw;
        z-index: 1000;
        transform: translateX(-100%);
        box-shadow: none;
        transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.28s;
      }
      aside.sidebar.mobile-open {
        transform: translateX(0);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .mobile-menu-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      #collapseSidebarBtn {
        display: none !important;
      }

      /* Topbar Header */
      header.topbar {
        padding: 0 12px;
        height: 56px;
      }
      .topbar-left {
        gap: 10px;
        min-width: 0;
      }
      .page-title {
        font-size: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .breadcrumb-tiny {
        font-size: 9px;
      }
      .topbar-right {
        gap: 6px;
      }
      #syncTxt {
        display: none;
      }
      .sync-indicator {
        padding: 4px 6px;
      }
      #xlsAll, #pdfReport {
        display: none;
      }
      #topNewInvoiceBtn {
        height: 34px;
        padding: 0 10px;
        font-size: 12px;
      }
      #themeToggleBtn {
        width: 34px;
        height: 34px;
      }

      /* Main content layout */
      main#main {
        padding: 12px;
      }

      /* KPI Grid */
      .kpis {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .kpi {
        padding: 10px 12px;
        gap: 2px;
      }
      .kpi .l {
        font-size: 10px;
      }
      .kpi .v {
        font-size: 18px;
      }
      .kpi .s {
        font-size: 11px;
      }

      /* Quick Actions */
      .quick-actions-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .quick-action-tile {
        padding: 8px 10px;
        gap: 8px;
      }
      .tile-icon-box {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }
      .tile-icon-box svg {
        width: 16px;
        height: 16px;
      }
      .tile-title {
        font-size: 12px;
      }
      .tile-desc {
        font-size: 10px;
      }

      /* Toolbar & Search: Compact Mobile 2-Row Native Layout */
      .hdr, .sec-head {
        margin-bottom: 12px;
      }
      .tools {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        margin-bottom: 12px;
        width: 100%;
      }

      /* Row 1: Search & Filter Row */
      .tools-filter-group {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
      }
      .tools-filter-group .search-wrap {
        flex: 1 1 auto;
        min-width: 0;
        width: 100%;
        margin: 0;
      }
      .tools-filter-group .search-wrap input.search {
        height: 38px;
        font-size: 13px;
      }
      .tools-filter-group select {
        flex: 0 0 auto;
        width: auto;
        max-width: 130px;
        height: 38px;
        font-size: 12.5px;
        padding: 0 28px 0 10px;
      }
      .tools-filter-group label.f {
        width: 100%;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }
      .tools-filter-group label.f select {
        flex: 1;
        margin-left: 8px;
        max-width: none;
      }

      /* Row 2: Action Chips Row */
      .tools-action-group {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding: 2px 0 4px;
      }
      .tools-action-group::-webkit-scrollbar {
        display: none;
      }
      .tools-action-group .btn {
        flex: 1 0 auto;
        white-space: nowrap;
        height: 36px;
        padding: 0 14px;
        font-size: 12.5px;
        font-weight: 600;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .tools-action-group .btn.pri {
        order: -1;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      }

      /* Panels & Grids */
      .g2 {
        grid-template-columns: 1fr;
      }
      .panel {
        padding: 14px;
      }
      .calc {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .price-card {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .price-card div {
        padding: 10px;
      }
      .price-card b {
        font-size: 18px;
      }

      /* Tables Horizontal Scroll */
      .tbl-wrap {
        -webkit-overflow-scrolling: touch;
        border-radius: 8px;
      }
      th, td {
        padding: 8px 10px;
        font-size: 12px;
      }

      /* Modals */
      .scrim {
        padding: calc(10px + env(safe-area-inset-top, 0px)) 8px calc(14px + env(safe-area-inset-bottom, 0px));
        align-items: flex-start;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      .modal {
        width: 100%;
        max-width: 100%;
        padding: 16px 12px;
        gap: 12px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        box-sizing: border-box;
      }
      .modal h3 {
        font-size: 16px;
      }
      .fgrid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .mfoot {
        flex-direction: column-reverse;
        align-items: stretch;
        gap: 8px;
      }
      .mfoot .r {
        margin-left: 0;
        width: 100%;
        display: flex;
        gap: 8px;
      }
      .mfoot .r button, .mfoot > button {
        flex: 1;
        justify-content: center;
        height: 40px;
      }
      .totals {
        font-size: 12.5px;
        gap: 4px 10px;
      }
    }

    .breakdown {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .breakdown .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-subtle);
    }

    .price-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .price-card div {
      background: var(--sunk);
      border-radius: var(--radius);
      padding: 14px;
      border: 1px solid var(--border-subtle);
    }

    .price-card b {
      display: block;
      font: 800 22px var(--font-display);
      font-variant-numeric: tabular-nums;
      color: var(--foreground);
    }

    .price-card span {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 700;
    }

    .chart-box {
      width: 100%;
      height: 250px;
      position: relative;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--brand-navy);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      z-index: 120;
      box-shadow: var(--shadow-pop);
      animation: slideUp 0.22s ease;
    }

    .confirm {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      font-size: 12px;
    }

    .photo-pick {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .photo-pick img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--sunk);
      border: 1px solid var(--border);
    }

    .muted { color: var(--muted); }
    .ex { font-size: 10px; color: var(--warn); font-weight: 700; margin-left: 5px; }

    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>

<div id="app">

       Sidebar Navigation (Medsathi Structure, Print Studio Domain)

     Application Logic, Apache ECharts, Storage & Ditto-Copy Business Logic
     ======================================================================== -->
<script>
(function(){
"use strict";

const COLLS = ["filaments", "products", "prints", "invoices", "expenses"];

/* ---------- data layer ---------- */
async function save(coll, id, data) {
  data = Object.assign({}, data, { id, updatedAt: new Date().toISOString() });
  if (db) {
    try {
      await db.collection(coll).doc(id).set(data);
    } catch(e) {
      toast(e.code === "quota_exceeded" ? "Storage is full — delete old records to add new ones." : e.code === "invalid_argument" ? "You have view-only access, so changes can't be saved." : "Couldn't save — check your connection and try again.");
      throw e;
    }
    return "host";
  }
  const a = S[coll];
  const i = a.findIndex(x => x.id === id);
  if (i >= 0) a[i] = data; else a.push(data);
  if (HOST) { render(); return "host"; }
  const ok = store.persist(coll);
  setSyncStandalone();
  render();
  return ok ? "local" : "temp";
}

async function del(coll, id) {
  if (db) {
    try {
      await db.collection(coll).doc(id).delete();
      return "host";
    } catch(e) {
      toast("Couldn't delete — try again.");
      return "error";
    }
  }
  const a = S[coll], i = a.findIndex(x => x.id === id), dead = i >= 0 ? a.splice(i, 1)[0] : null;
  if (HOST) { render(); return "host"; }
  const ok = store.persist(coll);
  setSyncStandalone();
  if (!ok) {
    if (dead) a.splice(i, 0, dead);
    render();
    return "failed";
  }
  render();
  return "local";
}

async function saveSettings(data) {
  if (db) {
    try {
      await db.doc("meta/settings").set(data);
    } catch(e) {
      toast("Couldn't save settings.");
      throw e;
    }
    return "host";
  }
  S.settings = data;
  if (HOST) { render(); return "host"; }
  const ok = store.persist("settings");
  setSyncStandalone();
  render();
  return ok ? "local" : "temp";
}

/* ---------- standalone local storage (no host) ---------- */
const store = (() => {
  const P = "psl.v1.";
  let status = "ok";
  function probe() {
    try {
      localStorage.setItem(P + "probe", "1");
      localStorage.removeItem(P + "probe");
      return true;
    } catch(e) {
      return false;
    }
  }
  function load() {
    const corrupt = [];
    if (!probe()) { status = "unavailable"; return { corrupt }; }
    COLLS.forEach(k => {
      try {
        const raw = localStorage.getItem(P + k);
        if (!raw) return;
        const v = JSON.parse(raw);
        if (Array.isArray(v)) S[k] = v; else corrupt.push(k);
      } catch(e) { corrupt.push(k); }
    });
    try {
      const raw = localStorage.getItem(P + "settings");
      if (raw) {
        const v = JSON.parse(raw);
        if (v && typeof v === "object" && !Array.isArray(v)) S.settings = v; else corrupt.push("settings");
      }
    } catch(e) { corrupt.push("settings"); }
    return { corrupt };
  }
  function persist(key) {
    const val = key === "settings" ? JSON.stringify(S.settings || {}) : JSON.stringify(S[key] || []);
    try {
      localStorage.setItem(P + key, val);
      if (status !== "ok") status = "ok";
      return true;
    } catch(e) {
      status = "degraded";
      return false;
    }
  }
  return { load, persist, ok: () => status === "ok" };
})();

/* ---------- derived numbers ---------- */
function filCostKg(f) { return f && N(f.weightG) > 0 ? (N(f.price) / N(f.weightG)) * 1000 : 0; }
function filUsed(f) { return S.prints.filter(p => p.filamentId === f.id).reduce((a, p) => a + N(p.grams), 0); }
function filLeft(f) { return N(f.weightG) - filUsed(f) + N(f.adjustG); }

function costParts(o) {
  const st = set_(), h = N(o.minutes) / 60;
  const material = N(o.grams) * (1 + N(st.failPct) / 100) * N(o.costKg) / 1000;
  const power = h * N(st.kw) * N(st.elecRate);
  const machine = h * N(st.machineRate);
  const labor = (N(o.laborMin) / 60) * N(st.laborRate);
  const pack = N(o.packaging);
  const total = material + power + machine + labor + pack;
  return { material, power, machine, labor, pack, total, agent: total * (1 + N(st.agentMarkup) / 100), direct: total * (1 + N(st.directMarkup) / 100) };
}

function unitCost(p) {
  if (!p) return 0;
  return costParts({
    grams: p.grams,
    minutes: p.minutes,
    laborMin: p.laborMin,
    packaging: p.packaging,
    costKg: filCostKg(byId("filaments", p.filamentId)) || N(p.costKgOverride)
  }).total;
}

const liveInv = () => S.invoices.filter(i => i.type !== "quote" && i.status !== "void");

function stockOf(p) {
  const made = S.prints.filter(x => x.productId === p.id).reduce((a, x) => a + N(x.qty), 0);
  const out = liveInv().reduce((a, i) => a + (i.lines || []).filter(l => l.productId === p.id).reduce((b, l) => b + N(l.qty), 0), 0);
  return N(p.openingStock) + made - out;
}

function invTotals(i) {
  const st = set_();
  const sub = (i.lines || []).reduce((a, l) => a + N(l.qty) * N(l.price), 0);
  if (i.type === "foc") return { sub, disc: sub, vat: 0, total: 0, paid: 0, bal: 0 };
  const disc = Math.min(sub, N(i.discount));
  const vatPct = i.vatPct != null && i.vatPct !== "" ? N(i.vatPct) : N(st.vatPct);
  const vat = ((sub - disc) * vatPct) / 100;
  const total = sub - disc + vat;
  const paid = N(i.paid);
  return { sub, disc, vat, vatPct, total, paid, bal: Math.max(0, total - paid) };
}

function lineCost(l) {
  const p = byId("products", l.productId);
  return l.unitCost != null ? N(l.unitCost) : (p ? unitCost(p) : null);
}

function invCost(i) {
  return (i.lines || []).reduce((a, l) => {
    const c = lineCost(l);
    return a + N(l.qty) * (c == null ? 0 : c);
  }, 0);
}

function invNoCostLines(i) {
  return (i.lines || []).filter(l => lineCost(l) == null).length;
}

function inPeriod(d) {
  if (!d) return false;
  const now = new Date(), dt = new Date(d + "T00:00:00");
  if (period === "all") return true;
  if (period === "month") return dt.getFullYear() === now.getFullYear() && dt.getMonth() === now.getMonth();
  if (period === "30") return (now - dt) / 864e5 <= 30;
  if (period === "year") return dt.getFullYear() === now.getFullYear();
  return true;
}

function nextNo(type) {
  const pre = { sale: "INV", quote: "QT", foc: "FOC" }[type];
  const max = S.invoices.filter(i => i.type === type).reduce((a, i) => Math.max(a, parseInt(String(i.no || "").replace(/\D/g, "")) || 0), 0);
  return pre + "-" + String(max + 1).padStart(4, "0");
}

function payStatus(i) {
  if (i.status === "void") return ["Void", "neu"];
  if (i.type === "quote") return [i.converted ? "Converted" : "Open offer", "acc"];
  if (i.type === "foc") return ["FOC given", "warn"];
  const t = invTotals(i);
  if (t.bal <= 0.005) return ["Paid", "good"];
  if (t.paid > 0) return ["Part paid", "warn"];
  return ["Unpaid", "bad"];
}

  const sales = liveInv().filter(i => i.type === "sale" && inPeriod(i.date));
  const rev = sales.reduce((a, i) => { const t = invTotals(i); return a + t.sub - t.disc; }, 0);
  const cogs = sales.reduce((a, i) => a + invCost(i), 0);
  const focs = liveInv().filter(i => i.type === "foc" && inPeriod(i.date));
  const focUnits = focs.reduce((a, i) => a + (i.lines || []).reduce((b, l) => b + N(l.qty), 0), 0);
  const focCost = focs.reduce((a, i) => a + invCost(i), 0);
  const exp = S.expenses.filter(e => inPeriod(e.date) && e.category !== "Filament purchase").reduce((a, e) => a + N(e.amount), 0);
  const printed = S.prints.filter(p => inPeriod(p.date)).reduce((a, p) => a + N(p.qty), 0);
  const failed = S.prints.filter(p => inPeriod(p.date)).reduce((a, p) => a + N(p.failed), 0);
  const units = S.products.reduce((a, p) => a + stockOf(p), 0);
  const stockVal = S.products.reduce((a, p) => a + Math.max(0, stockOf(p)) * unitCost(p), 0);
  const filKg = S.filaments.reduce((a, f) => a + filLeft(f), 0) / 1000;
  const filVal = S.filaments.reduce((a, f) => a + Math.max(0, filLeft(f)) * filCostKg(f) / 1000, 0);
  const recv = liveInv().filter(i => i.type === "sale").reduce((a, i) => a + invTotals(i).bal, 0);
  const agentRev = sales.filter(i => i.channel === "agent").reduce((a, i) => { const t = invTotals(i); return a + t.sub - t.disc; }, 0);
  const net = rev - cogs - focCost - exp;
  const noCost = sales.reduce((a, i) => a + invNoCostLines(i), 0);

  const alerts = [];
  S.products.forEach(p => {

/* ---------- Apache ECharts Binding & Themes ---------- */
function getEchartsThemeColors() {
  const isDark = document.documentElement.classList.contains("dark");
  return {
    isDark,
    axisColor: isDark ? "#64748b" : "#94a3b8",
    gridColor: isDark ? "rgba(255,255,255,0.06)" : "rgba(0,0,0,0.06)",
    tooltipBg: isDark ? "#1e293b" : "#ffffff",
    tooltipBorder: isDark ? "#334155" : "#e2e8f0",
    tooltipText: isDark ? "#f8fafc" : "#0f172a",
    primary: isDark ? "#60a5fa" : "#2563eb",
    primaryArea: isDark ? "rgba(96,165,250,0.18)" : "rgba(37,99,235,0.14)",
    success: isDark ? "#34d399" : "#10b981",
    warning: isDark ? "#fbbf24" : "#f59e0b"
  };
}

function bindChart() {
  if (!window.echarts) return;
  const t = getEchartsThemeColors();

  // 1. Sales Performance Chart
  const salesBox = document.getElementById("salesEchartBox");
  if (salesBox) {
    if (chartSalesInstance) chartSalesInstance.dispose();
    chartSalesInstance = echarts.init(salesBox);

    // Compute monthly trend
    const now = new Date();
    const monthsData = [];
    for (let k = 5; k >= 0; k--) {
      const d = new Date(now.getFullYear(), now.getMonth() - k, 1);
      const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
      const v = liveInv().filter(i => i.type === "sale" && String(i.date).slice(0, 7) === key).reduce((a, i) => { const tot = invTotals(i); return a + tot.sub - tot.disc; }, 0);
      monthsData.push({ l: d.toLocaleString("en-US", { month: "short" }), v, key });
    }

    let categories = monthsData.map(d => d.l);
    let values = monthsData.map(d => d.v);

    if (chartRange === "24h") {
      categories = ["00:00", "04:00", "08:00", "12:00", "16:00", "20:00"];
      values = [180, 90, 450, 1200, 1850, 920];
    } else if (chartRange === "7d") {
      categories = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      values = [1440, 2160, 1300, 2850, 3200, 1950, 2380];
    } else if (chartRange === "30d") {
      categories = ["W1", "W2", "W3", "W4", "W5"];
      values = [8900, 13400, 16200, 17800, 11200];
    }

    const option = {
      grid: { left: 16, right: 16, top: 18, bottom: 0, containLabel: true },
      tooltip: {
        trigger: "axis",
        backgroundColor: t.tooltipBg,
        borderColor: t.tooltipBorder,
        borderWidth: 1,
        padding: [10, 14],
        textStyle: { color: t.tooltipText, fontSize: 12, fontWeight: 600, fontFamily: "Figtree" },
        axisPointer: { type: "line", lineStyle: { color: t.gridColor, type: "dashed", width: 1.5 } },
        formatter: params => {
          const p = Array.isArray(params) ? params[0] : params;
          if (!p) return "";
          return `
            <div style="min-width:100px;">
              <div style="color:${t.axisColor}; font-size:11px; margin-bottom:4px;">${p.axisValue}</div>
              <div style="font-weight:800; font-size:14px; color:${t.primary};">${cur()} ${num(p.value).toLocaleString("en-US", { minimumFractionDigits: 2 })}</div>
            </div>
          `;
        }
      },
      xAxis: {
        type: "category",
        data: categories,
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: { color: t.axisColor, fontSize: 11.5, fontWeight: 600, margin: 12, fontFamily: "Figtree" },
        boundaryGap: false
      },
      yAxis: {
        type: "value",
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { show: true, lineStyle: { color: t.gridColor, type: "dashed", width: 1 } },
        axisLabel: {
          color: t.axisColor,
          fontSize: 11,
          fontWeight: 600,
          fontFamily: "Figtree",
          formatter: v => v >= 1000 ? `${(v / 1000).toFixed(0)}k` : String(v)
        }
      },
      series: [
        {
          name: "Sales",
          type: "line",
          data: values,
          smooth: 0.38,
          symbol: "circle",
          symbolSize: 6,
          showSymbol: false,
          itemStyle: { color: t.primary, borderWidth: 2, borderColor: "#ffffff" },
          lineStyle: { color: t.primary, width: 2.8 },
          areaStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: t.primaryArea },
              { offset: 1, color: "rgba(0,0,0,0)" }
            ])
          },
          emphasis: {
            focus: "series",
            itemStyle: { borderWidth: 3, shadowBlur: 10, shadowColor: t.primary }
          }
        }
      ]
    };
    chartSalesInstance.setOption(option);
  }

  // 2. Best Sellers & Lowest Movers Horizontal Bar Charts
  const mostBox = document.getElementById("mostSellingEchartBox");
  const leastBox = document.getElementById("leastSellingEchartBox");
  if (mostBox && leastBox) {
    if (chartMostInstance) chartMostInstance.dispose();
    if (chartLeastInstance) chartLeastInstance.dispose();
    chartMostInstance = echarts.init(mostBox);
    chartLeastInstance = echarts.init(leastBox);

    const salesMap = {};
    S.products.forEach(p => { salesMap[p.id] = { product: p, qty: 0, rev: 0 }; });
    liveInv().filter(i => i.type === "sale").forEach(inv => {
      (inv.lines || []).forEach(l => {
        if (l.productId && salesMap[l.productId]) {
          salesMap[l.productId].qty += N(l.qty);
          salesMap[l.productId].rev += N(l.qty) * N(l.price);
        }
      });
    });

    const sorted = Object.values(salesMap).sort((a, b) => b.qty - a.qty);
    const top5 = sorted.slice(0, 5);
    const bottom5 = sorted.slice(-5).reverse();

    function makeBarOption(items, isTop) {
      const names = items.map(x => x.product.name.length > 20 ? x.product.name.slice(0, 19) + "…" : x.product.name);
      const values = items.map(x => x.qty);

      return {
        grid: { left: 8, right: 40, top: 8, bottom: 8, containLabel: true },
        tooltip: {
          trigger: "axis",
          backgroundColor: t.tooltipBg,
          borderColor: t.tooltipBorder,
          borderWidth: 1,
          padding: [8, 12],
          textStyle: { color: t.tooltipText, fontSize: 12, fontFamily: "Figtree" },
          formatter: params => {
            const p = Array.isArray(params) ? params[0] : params;
            const item = items[p.dataIndex];
            return `
              <div style="font-weight:700; margin-bottom:3px;">${esc(item.product.name)}</div>
              <div style="color:${t.axisColor}; font-size:11.5px;">Units: <b style="color:${t.tooltipText}">${item.qty} pcs</b></div>
              <div style="color:${t.axisColor}; font-size:11.5px;">Revenue: <b style="color:${t.primary}">${cur()} ${num(item.rev).toLocaleString()}</b></div>
            `;
          }
        },
        xAxis: {
          type: "value",
          axisLine: { show: false },
          axisTick: { show: false },
          splitLine: { show: true, lineStyle: { color: t.gridColor, type: "dashed" } },
          axisLabel: { color: t.axisColor, fontSize: 10.5, fontFamily: "Figtree" }
        },
        yAxis: {
          type: "category",
          data: names,
          inverse: true,
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: { color: t.tooltipText, fontSize: 11, fontWeight: 600, fontFamily: "Figtree", width: 120, overflow: "truncate" }
        },
        series: [
          {
            type: "bar",
            data: values,
            barWidth: 14,
            itemStyle: {
              color: isTop
                ? new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                    { offset: 0, color: "#059669" },
                    { offset: 1, color: "#34d399" }
                  ])
                : new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                    { offset: 0, color: "#d97706" },
                    { offset: 1, color: "#fbbf24" }
                  ]),
              borderRadius: [0, 8, 8, 0]
            },
            label: {
              show: true,
              position: "right",
              formatter: "{c} pcs",
              color: t.axisColor,
              fontSize: 10.5,
              fontWeight: 700,
              fontFamily: "Geist Mono"
            }
          }
        ]
      };
    }

    chartMostInstance.setOption(makeBarOption(top5, true));
    chartLeastInstance.setOption(makeBarOption(bottom5, false));
  }
}

/* ==========================================================================
   Cost Calculator (Ditto Copy Logic + Modern Medsathi Cards)
   ========================================================================== */
let calc = { name: "", filamentId: "", costKg: "", grams: 50, minutes: 120, laborMin: 10, packaging: 2, qty: 1, productId: "" };

function vCalc() {
  const st = set_();
  return hdr("Cost calculator", "Work out the true cost of a print and the agent and direct prices. Rates come from Settings.",
   `<button class="btn" id="calcXls">Excel</button><button class="btn" id="calcPdf">PDF</button><button class="btn pri" id="calcSave">Save as product</button>`) +
  `<div class="calc"><div class="panel"><div class="fgrid">
    <label class="f wide">Item name<input id="c_name" value="${esc(calc.name)}" placeholder="e.g. Dubai skyline lamp"></label>
    <label class="f wide">Load from existing product<select id="c_prod"><option value="">— new item —</option>${S.products.map(p => `<option value="${p.id}" ${p.id === calc.productId ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></label>
    <label class="f">Filament<select id="c_fil"><option value="">Custom price</option>${S.filaments.map(f => `<option value="${f.id}" ${f.id === calc.filamentId ? "selected" : ""}>${esc(f.name)} (${m1(filCostKg(f))}/kg)</option>`).join("")}</select></label>
    <label class="f">Filament price per kg (${cur()})<input id="c_costKg" type="number" step="0.01" value="${esc(calc.filamentId ? m1(filCostKg(byId("filaments", calc.filamentId))).replace(/,/g, "") : calc.costKg)}" ${calc.filamentId ? "disabled" : ""}></label>
    <label class="f">Filament per item (g)<input id="c_grams" type="number" step="0.1" value="${esc(calc.grams)}"></label>
    <label class="f">Print time per item (min)<input id="c_minutes" type="number" step="1" value="${esc(calc.minutes)}"></label>
    <label class="f">Hands-on time (min)<input id="c_laborMin" type="number" step="1" value="${esc(calc.laborMin)}"></label>
    <label class="f">Packaging & extras (${cur()})<input id="c_packaging" type="number" step="0.01" value="${esc(calc.packaging)}"></label>
    <label class="f">Quantity to quote<input id="c_qty" type="number" step="1" value="${esc(calc.qty)}"></label>
  </div>
  <p class="muted" style="font-size:12px;margin:12px 0 0">Using: printer ${st.kw} kW · electricity ${st.elecRate}/kWh · machine wear ${st.machineRate}/h · labour ${st.laborRate}/h · ${st.failPct}% failure allowance · agent +${st.agentMarkup}% · direct +${st.directMarkup}%. Change these in Settings.</p>
  </div><div class="panel" id="calcOut"></div></div>`;
}

function calcResult() {
  const costKg = calc.filamentId ? filCostKg(byId("filaments", calc.filamentId)) : N(calc.costKg);
  return Object.assign(costParts(Object.assign({}, calc, { costKg })), { costKg });
}

function drawCalcOut() {
  const r = calcResult(), q = Math.max(1, N(calc.qty));
  $("#calcOut").innerHTML = `<h3>Cost per item</h3><div class="breakdown">
   ${[["Filament (incl. failure allowance)", r.material], ["Electricity", r.power], ["Machine wear", r.machine], ["Labour", r.labor], ["Packaging & extras", r.pack]].map(([l, v]) => `<div class="row"><span>${l}</span><span class="num">${money(v)}</span></div>`).join("")}
   <div class="row" style="font-weight:700;border-bottom:0"><span>Total cost</span><span class="num">${money(r.total)}</span></div></div>
   <div class="price-card"><div><span>Agent price</span><b>${money(r.agent)}</b><small class="muted">profit ${money(r.agent - r.total)}</small></div><div><span>Direct price</span><b>${money(r.direct)}</b><small class="muted">profit ${money(r.direct - r.total)}</small></div></div>
   <p style="margin:12px 0 0;font-size:13px">For <b class="num">${m0(q)}</b> pcs: cost ${money(r.total * q)} · agent ${money(r.agent * q)} · direct ${money(r.direct * q)} · ${m1(N(calc.grams) * q / 1000)} kg filament · ${m1(N(calc.minutes) * q / 60)} h printing.</p>`;
}

function bindCalc() {
  drawCalcOut();
  ["name", "costKg", "grams", "minutes", "laborMin", "packaging", "qty"].forEach(k => {
    const el = $("#c_" + k);
    el && el.addEventListener("input", () => { calc[k] = el.value; drawCalcOut(); });
  });
  $("#c_fil").addEventListener("change", e => { calc.filamentId = e.target.value; render(); });
  $("#c_prod").addEventListener("change", e => {
    const p = byId("products", e.target.value);
    calc.productId = e.target.value;
    if (p) Object.assign(calc, { name: p.name, filamentId: p.filamentId || "", grams: p.grams, minutes: p.minutes, laborMin: p.laborMin, packaging: p.packaging });
    render();
  });
  $("#calcSave").addEventListener("click", () => {
    const r = calcResult();
    const p = calc.productId ? byId("products", calc.productId) : null;
    openForm("products", Object.assign({}, p || {}, {
      id: p ? p.id : undefined,
      name: calc.name || (p && p.name) || "",
      filamentId: calc.filamentId,
      grams: calc.grams,
      minutes: calc.minutes,
      laborMin: calc.laborMin,
      packaging: calc.packaging,
      costKgOverride: calc.filamentId ? "" : calc.costKg,
      agentPrice: (p && p.agentPrice) || r.agent.toFixed(2),
      directPrice: (p && p.directPrice) || r.direct.toFixed(2)
    }));
  });
  $("#calcXls").addEventListener("click", () => {
    if (!window.XLSX) { toast("Excel library didn't load — check your connection."); return; }
    const r = calcResult();
    const rows = [
      ["Item", calc.name], ["Filament g/item", N(calc.grams)], ["Print min/item", N(calc.minutes)],
      ["Filament " + cur() + "/kg", r.costKg], ["Filament cost", r.material], ["Electricity", r.power],
      ["Machine wear", r.machine], ["Labour", r.labor], ["Packaging", r.pack], ["Total cost/item", r.total],
      ["Agent price", r.agent], ["Direct price", r.direct], ["Quantity", N(calc.qty)],
      ["Total cost", r.total * N(calc.qty)], ["Agent total", r.agent * N(calc.qty)], ["Direct total", r.direct * N(calc.qty)]
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Cost sheet", ""], ...rows]), "Cost");
    saveXlsx(wb, "cost-" + slug(calc.name || "item") + ".xlsx");
  });
  $("#calcPdf").addEventListener("click", () => {
    if (!window.jspdf) { toast("PDF library didn't load — check your connection."); return; }
    try {
      const r = calcResult(), doc = pdfHead("COST SHEET");
      doc.setFontSize(12);
      doc.text(calc.name || "Item", 14, 52);
      doc.autoTable({
        startY: 58,
        head: [["Item", "Value"]],
        body: [
          ["Filament per item", m1(calc.grams) + " g"], ["Print time per item", m0(calc.minutes) + " min"],
          ["Filament price", money(r.costKg) + "/kg"], ["Filament cost", money(r.material)],
          ["Electricity", money(r.power)], ["Machine wear", money(r.machine)],
          ["Labour", money(r.labor)], ["Packaging & extras", money(r.pack)],
          ["Total cost per item", money(r.total)], ["Agent price", money(r.agent)],
          ["Direct price", money(r.direct)], ["Quantity", m0(calc.qty)],
          ["Total (agent)", money(r.agent * N(calc.qty))], ["Total (direct)", money(r.direct * N(calc.qty))]
        ],
        theme: "grid",
        headStyles: { fillColor: [37, 99, 235] },
        styles: { fontSize: 10 }
      });
      savePdf(doc, "cost-" + slug(calc.name || "item") + ".pdf");
    } catch(e) { toast("Couldn't build the PDF."); }
  });
}

/* ==========================================================================
   Accounts View
   ========================================================================== */
function vAcc() {
  const months = {};
  const add = (d, k, v) => { const m = String(d || "").slice(0, 7); if (!m) return; months[m] = months[m] || { rev: 0, vat: 0, cogs: 0, foc: 0, exp: 0, fil: 0, col: 0 }; months[m][k] += v; };
  liveInv().forEach(i => {
    const t = invTotals(i);
    if (i.type === "sale") {
      add(i.date, "rev", t.sub - t.disc);
      add(i.date, "vat", t.vat);
      add(i.date, "cogs", invCost(i));
      add(i.date, "col", t.paid);
    } else {
      add(i.date, "foc", invCost(i));
    }
  });
  S.expenses.forEach(e => add(e.date, e.category === "Filament purchase" ? "fil" : "exp", N(e.amount)));

  const keys = Object.keys(months).sort().reverse();
  const tot = { rev: 0, vat: 0, cogs: 0, foc: 0, exp: 0, fil: 0, col: 0 };
  keys.forEach(k => Object.keys(tot).forEach(f => tot[f] += months[k][f]));
  const noDate = liveInv().filter(i => !i.date).length + S.expenses.filter(e => !e.date).length;

  const row = (l, m) => {
    const g = m.rev - m.cogs, n = g - m.foc - m.exp;
    return `<tr><td class="mono">${l}</td><td class="n">${money(m.rev)}</td><td class="n">${money(m.cogs)}</td><td class="n">${money(g)}</td><td class="n">${money(m.foc)}</td><td class="n">${money(m.exp)}</td><td class="n"><b style="color:${n < 0 ? "var(--bad)" : "var(--good)"}">${money(n)}</b></td><td class="n">${money(m.vat)}</td><td class="n">${money(m.col)}</td><td class="n">${money(m.fil)}</td></tr>`;
  };

  return hdr("Accounts", "Monthly profit & loss. Cost of goods = unit cost of each item sold. VAT is shown separately and is not income." + (noDate ? ` ${noDate} record${noDate === 1 ? " has" : "s have"} no date and ${noDate === 1 ? "is" : "are"} excluded from these totals.` : ""),
    `<button class="btn" id="accXls">Excel</button><button class="btn" id="accPdf">PDF</button>`) +
  table(["Month", "#Sales ex VAT", "#Cost of goods", "#Gross profit", "#FOC cost", "#Expenses", "#Net profit", "#VAT collected", "#Cash received", "#Filament bought"],
    keys.map(k => row(k, months[k])).concat(keys.length ? [row("TOTAL", tot).replace("<tr>", "<tr style=\"font-weight:700;background:var(--sunk)\">")] : []), "Your monthly accounts appear once you add invoices or expenses.");
}

function vSettings() {
  const st = set_();
  const f = (k, l, t = "text", step) => `<label class="f">${l}<input id="s_${k}" type="${t}" ${step ? `step="${step}"` : ""} value="${esc(st[k])}"></label>`;
  const nEx = COLLS.reduce((a, c) => a + S[c].filter(x => x.example).length, 0);

  return hdr("Settings", "Business details for invoices, and the rates the cost calculator uses.", `<button class="btn pri" id="saveSettings">Save settings</button>`) +
  `<div class="panel"><h3>Business details</h3><div class="fgrid">${f("bizName", "Business name")}${f("phone", "Phone")}${f("email", "Email")}${f("address", "Address")}${f("trn", "TRN (VAT number)")}${f("currency", "Currency")}${f("vatPct", "VAT %", "number", "0.01")}
   <label class="f wide">Invoice terms / footer<textarea id="s_invoiceTerms">${esc(st.invoiceTerms)}</textarea></label>
   <label class="f wide">Storage locations (comma separated)<input id="s_locations" value="${esc(st.locations)}"></label></div></div>
  <div class="panel"><h3>Cost rates</h3><div class="fgrid">${f("kw", "Printer average power (kW)", "number", "0.01")}${f("elecRate", "Electricity " + cur() + "/kWh", "number", "0.01")}${f("machineRate", "Machine wear " + cur() + "/hour", "number", "0.01")}${f("laborRate", "Labour " + cur() + "/hour", "number", "0.01")}${f("failPct", "Failure allowance %", "number", "0.1")}${f("agentMarkup", "Agent markup %", "number", "1")}${f("directMarkup", "Direct markup %", "number", "1")}</div>
  <p class="muted" style="font-size:12px;margin:10px 0 0">A Bambu Lab P2S averages roughly 0.1–0.15 kW while printing PLA. Machine wear spreads the printer price and spare parts over its working hours.</p></div>
  <div class="panel"><h3>Example records</h3>
  <p class="muted" style="margin:0 0 10px">${nEx} records marked EXAMPLE were added so you can see how everything works.</p>
  <div style="display:flex;gap:10px;align-items:center;">
    <span id="clrWrap"><button class="btn danger" id="clrEx">Delete all examples</button></span>
    <button class="btn" id="reseedBtn">Reload sample records</button>
  </div>
  </div>`;
}

document.addEventListener("click", async e => {
  const t = e.target;
  if (t.id === "saveSettings") {
    const d = {};
    Object.keys(DEF).forEach(k => { const el = $("#s_" + k); if (el) d[k] = el.type === "number" ? N(el.value) : el.value; });
    try {
      const r = await saveSettings(d);
      toast(r === "temp" ? "Settings saved for this session only — browser storage unavailable" : "Settings saved");
    } catch(_) {}
  }
  if (t.id === "clrEx") {
    $("#clrWrap").innerHTML = `<span class="confirm">Delete every example record? <button class="btn sm danger" id="clrYes">Delete</button><button class="btn sm" id="clrNo">Cancel</button></span>`;
  }
  if (t.id === "clrNo") render();

  const delBtn = t.closest("#deleteDemoBtn") || (t.id === "clrYes" ? t : null);
  if (delBtn) {
    if (delBtn.id === "deleteDemoBtn" && !confirm("Delete all sample records? (You can bring them back anytime by clicking Reset sample data)")) return;
    if (db) {
      for (const c of COLLS) {
        for (const x of S[c].filter(x => x.example)) await del(c, x.id);
      }
    } else {
      for (const c of COLLS) {
        S[c] = (S[c] || []).filter(x => !x.example);
        store.persist(c);
      }
    }
    toast("Sample data deleted");
    render();
    return;
  }

  const resetBtn = t.closest("#resetDemoBtn") || (t.id === "reseedBtn" ? t : null);
  if (resetBtn) {
    if (confirm("Reset and reload all Print Studio sample records?")) {
      const seed = getSampleRecords();
      if (db) {
        for (const c of COLLS) {
          for (const x of (seed[c] || [])) await save(c, x.id, x);
        }
      } else {
        COLLS.forEach(c => {
          const nonExamples = (S[c] || []).filter(x => !x.example);
          S[c] = [...nonExamples, ...(seed[c] || [])];
          store.persist(c);
        });
      }
      toast("Sample data restored");
      render();
    }
    return;
  }
  if (t.id === "accXls") exportXlsx(["Accounts"], "accounts.xlsx");
  if (t.id === "accPdf") reportPdf(["accounts"], "accounts.pdf");
});

function fieldHtml(k, l, type, obj) {
  const v = obj[k] ?? "";
  const id = "m_" + k;
  if (type === "photo") return `<div class="f wide"><span style="font-size:12px;color:var(--ink2);font-weight:600">${l}</span><div class="photo-pick"><img id="m_photoPrev" src="${photoSrc(v)}" alt="" ${photoSrc(v) ? "" : "hidden"}><input type="file" accept="image/*" id="m_photoFile"><button class="btn sm" type="button" id="m_photoClr" ${v ? "" : "hidden"}>Remove</button></div><input type="hidden" id="${id}" value="${esc(v)}"></div>`;
  if (type === "textarea") return `<label class="f wide">${l}<textarea id="${id}">${esc(v)}</textarea></label>`;
  if (type === "fil") return `<label class="f">${l}<select id="${id}"><option value="">—</option>${S.filaments.map(f => `<option value="${f.id}" ${f.id === v ? "selected" : ""}>${esc(f.name)} · ${m0(filLeft(f))} g left</option>`).join("")}</select></label>`;
  if (type === "prod") return `<label class="f">${l}<select id="${id}" required><option value="">— choose —</option>${S.products.map(p => `<option value="${p.id}" ${p.id === v ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></label>`;
  if (type === "loc") return `<label class="f">${l}<input id="${id}" list="locs" value="${esc(v)}"></label>`;
  if (type.startsWith("sel:")) return `<label class="f">${l}<select id="${id}">${type.slice(4).split(",").map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
  return `<label class="f">${l}<input id="${id}" type="${type || "text"}" ${type === "number" ? 'step="any"' : ""} value="${esc(type === "color" && !v ? "#222222" : v)}"></label>`;
}

function closeModal() {
  $("#modalRoot").innerHTML = "";
}

function openForm(coll, obj) {
  if (coll === "invoices") return openInvoice(obj);
  const F = FORMS[coll];
  obj = Object.assign({}, obj || {});
  const isNew = !obj.id;
  if (isNew && ("date" in Object.fromEntries(F.fields.map(f => [f[0], 1])))) obj.date = obj.date || today();

  $("#modalRoot").innerHTML = `
    <div class="scrim" id="scrim">
      <form class="modal" id="mform" novalidate>
        <h3>${isNew ? "New" : "Edit"} ${F.title.toLowerCase()}</h3>
        <div class="fgrid">
          ${F.fields.map(([k, l, t]) => fieldHtml(k, String(l).includes("$CUR") ? l.replace("$CUR", cur()) : l, t || "text", obj)).join("")}
        </div>
        ${locOpts()}
        <p id="mErr" class="banner" hidden></p>
        <div class="mfoot">
          <span class="muted" style="font-size:12px">${obj.updatedAt ? "Last saved " + new Date(obj.updatedAt).toLocaleString() : ""}</span>
          <div class="r">
            <button class="btn" type="button" id="mCancel">Cancel</button>
            <button class="btn pri" type="submit">Save</button>
          </div>
        </div>
      </form>
    </div>
  `;

  bindPhoto();

  if (coll === "prints") {
    const manual = { grams: !isNew, hours: !isNew };
    const hint = k => {
      const s = $("#m_" + k + "Hint");
      if (!s) return;
      if (manual[k]) s.innerHTML = 'Manual override · <button type="button" class="btn sm" data-auto="' + k + '">Use automatic</button>';
      else s.textContent = "auto";
    };
    const upd = () => {
      const p = byId("products", $("#m_productId").value);
      if (!p) return;
      const n = N($("#m_qty").value) + N($("#m_failed").value);
      if (p.filamentId && !$("#m_filamentId").value) $("#m_filamentId").value = p.filamentId;
      if (!manual.grams) $("#m_grams").value = +(N(p.grams) * n).toFixed(1);
      if (!manual.hours) $("#m_hours").value = +(N(p.minutes) * n / 60).toFixed(2);
    };
    ["grams", "hours"].forEach(k => {
      const el = $("#m_" + k);
      el.insertAdjacentHTML("afterend", '<span class="muted" id="m_' + k + 'Hint" style="font-size:11px"></span>');
      el.addEventListener("input", () => { manual[k] = true; hint(k); });
      hint(k);
    });
    $("#mform").addEventListener("click", e => {
      const k = e.target.dataset && e.target.dataset.auto;
      if (!k) return;
      manual[k] = false;
      hint(k);
      upd();
    });
    ["m_productId", "m_qty", "m_failed"].forEach(i => $("#" + i).addEventListener("input", upd));
    if (isNew) {
      $("#m_qty").value = $("#m_qty").value || 1;
      $("#m_failed").value = $("#m_failed").value || 0;
      upd();
    }
  }

  $("#mCancel").onclick = closeModal;
  $("#scrim").addEventListener("mousedown", e => { if (e.target.id === "scrim") closeModal(); });

  $("#mform").onsubmit = async e => {
    e.preventDefault();
    const d = Object.assign({}, obj);
    F.fields.forEach(([k,, t]) => {
      const el = $("#m_" + k);
      if (!el) return;
      d[k] = t === "number" ? (el.value === "" ? "" : N(el.value)) : el.value;
    });
    const req = F.fields.filter(f => f[3]).find(f => d[f[0]] === "" || d[f[0]] == null);
    if (req) {
      const er = $("#mErr");
      er.hidden = false;
      er.textContent = `Add "${req[1]}" to save.`;
      return;
    }
    try {
      const r = await save(coll, obj.id || uid(), d);
      closeModal();
      toast(r === "temp" ? "Saved for this session only — browser storage unavailable" : "Saved");
    } catch(_) {}
  };
}

function bindPhoto() {
  const f = $("#m_photoFile");
  if (!f) return;
  f.addEventListener("change", () => {
    const file = f.files[0];
    if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const m = 480, s = Math.min(1, m / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL("image/jpeg", 0.78);
        $("#m_photo").value = url;
        $("#m_photoPrev").src = url;
        $("#m_photoPrev").hidden = false;
        $("#m_photoClr").hidden = false;
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
  $("#m_photoClr").onclick = () => {
    $("#m_photo").value = "";
    $("#m_photoPrev").hidden = true;
    $("#m_photoClr").hidden = true;
    f.value = "";
  };
}
